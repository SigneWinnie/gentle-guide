spring.datasource.url=jdbc:mysql://localhost:3306/registrationdb?useSSL=false&serverTimezone=UTC&createDatabaseIfNotExist=true&allowMultiQueries=true&allowPublicKeyRetrieval=true
spring.datasource.username=root
spring.datasource.password=root

# JPA/Hibernate configuration - automatically create/update tables
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true

server.port=8085
spring.application.name=registration-service

eureka.client.service-url.defaultZone=http://localhost:8762/eureka/

eureka.instance.prefer-ip-address=true